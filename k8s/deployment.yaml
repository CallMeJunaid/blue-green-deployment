apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflow-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflow-dashboard
  template:
    metadata:
      labels:
        app: cloudflow-dashboard
    spec:
      containers:
        - name: cloudflow-container
          image: junaid404/cloudflow-dashboard:1.0
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
